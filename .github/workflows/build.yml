name: Construir APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar archivos
        run: |
          mkdir -p app/src/main/java/com/comandos/os app/src/main/res/values
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv themes.xml app/src/main/res/values/
          mv MainActivity.kt app/src/main/java/com/comandos/os/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: comandOS-apk
          path: app/build/outputs/apk/debug/app-debug.apk
